<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>htnml Events </title>
</head>

<body style="background-color: #414141; color: aliceblue;">
    <h2>Amazing image</h2>
    <div>
        <ul id="images">
            <li><img width="200px" id="photoshop" src="1.png" alt="photoshop"></li>
            <li><img width="200px" id="japan" src="2.png" alt=""></li>
            <li><img width="200px" id="river" src="3.png" alt=""></li>
            <li><img width="200px" id="owl" src="4.png" alt=""></li>
            <li><img width="200px" id="prayer" src="5.png" alt=""></li>
            <li><a style="color: aliceblue;" href="https://google.com" id="google">Google</a></li>
        </ul>
    </div>
</body>
<script>
    document.getElementById('owl').onclick = function () {
        alert("Hello this is a screenshots")
    }

    document.getElementById('owl').addEventListener('click', function () {
        alert("Again clicked the photos...")
    })

    //Attchevent()
    //jQuery -on
    //type,timestamp,defaultPrevented
    //target , toElement  ,srcElement, CurrentTarget

    //clientX ,clientY ,screenX ,screenY
    //altkey ,  ctrlkey ,shiftkey, keycode


    document.getElementById('owl').addEventListener('click', function (e) {
        // alert("Again clicked the photos...")

        console.log("click inside thr ul")
    }, false)

    document.getElementById('owl').addEventListener('click', function (e) {
        // alert("Again clicked the photos...")

        console.log("owl clicked")
        e.stopPropagation()
    }, false)

    document.getElementById('google').addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        console.log("Google clicked");

    }, false)

    document.querySelector('#images').addEventListener('click', function (e) {
        console.log(e.target.tagName)


        if (e.target.tagName === "IMG") {
            console.log(e.target.id)
            let removveIt = e.target.parentNode
            removveIt.remove()

        }

        // removveIt.parentNode.removeChild(removveIt)


    })





</script>
