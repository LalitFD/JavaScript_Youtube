<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Aur code | DOM </title>
</head>

<body style="background-color: black; color: brown;">
    <ul class="language">
        <li>javasscript</li>
    </ul>
</body>
<script>

    // ye ek tarika hai jisse hm data ko add kar sakte hai jaise ki ham javascript ke bad hamne java or c++ likha hai to ye data ko add karne ka tarika hai 
    function addLanguage(langName) {
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addLanguage("python")
    addLanguage("java")
    //yaha ek different tarikaa hai language ko add karna 
    function addOptiLang(language) {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(language))
        document.querySelector('.language').appendChild(li)
    }
    addOptiLang("C++")


    //is function se ham data ko edit kar sakte hai 
    const secondlanguage = document.querySelector("li:nth-child(2)")
    // secondlanguage.innerHTML="Mojo"

    // ek ye or dusra tarika hai edit karne ka
    const newli = document.createElement('li')
    newli.textContent = "MOJO"
    secondlanguage.replaceWith(newli)

    //edit 
    const firstlang=document.querySelector("li:first-child")
    firstlang.outerHTML= '<li> Typescript </li>'
    

    //REMOVE        
    const lastlang=document.querySelector('li:nth-child(2)')
    lastlang.remove()

    
</script>

</html>
